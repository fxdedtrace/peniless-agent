name: Penniless Agent

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours UTC
  workflow_dispatch:          # manual "Run agent" button

permissions:
  contents: write             # needed to commit status.md back

concurrency:
  group: penniless-agent
  cancel-in-progress: false   # never kill a running agent mid-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_WALLET:      ${{ secrets.AGENT_WALLET }}
          AGENT_NETWORK:     base        # or: solana
        run: python main.py

      - name: Commit status log
        run: |
          git config user.name  "penniless-agent[bot]"
          git config user.email "penniless-agent[bot]@users.noreply.github.com"
          git add status.md solutions/ run_state.json status_archive.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "agent: run log $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
